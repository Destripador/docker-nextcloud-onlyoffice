[www]
; Pool público equilibrado para desarrollo y despliegues pequeños.
; ondemand mantiene bajo el consumo en reposo y permite absorber ráfagas de
; peticiones del dashboard de Nextcloud sin quedarse en los 5 workers del
; valor predeterminado de la imagen.
pm = ondemand
pm.max_children = 20
pm.process_idle_timeout = 10s
pm.max_requests = 500
